<div class="visua11y-agent-menu" role="dialog" aria-modal="true" aria-label="Accessibility Menu">
  <div class="visua11y-agent-menu-header">
    <div class="visua11y-agent-menu-title visua11y-agent-translate">Accessibility Menu</div>
    <div class="visua11y-agent-menu-header-group" style="gap: 15px">
      <button type="button" class="visua11y-agent-menu-reset" title="Reset settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 3v5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="visua11y-agent-language-wrapper">
        <button
          type="button"
          class="visua11y-agent-menu-language"
          title="Language"
          aria-label="Language"
          aria-controls="visua11y-agent-language-panel"
          aria-expanded="false"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M2.5 12h19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 2.5a14 14 0 0 1 4.5 9.5 14 14 0 0 1-4.5 9.5 14 14 0 0 1-4.5-9.5 14 14 0 0 1 4.5-9.5z" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
        <div
          class="visua11y-agent-language-panel"
          id="visua11y-agent-language-panel"
          role="dialog"
          aria-label="Language"
          hidden
        >
          <div class="visua11y-agent-language-panel-header">
            <input
              type="search"
              class="visua11y-agent-language-search"
              placeholder="Search languages"
            />
          </div>
          <div class="visua11y-agent-language-list" role="listbox" aria-label="Languages"></div>
          <div class="visua11y-agent-language-empty" hidden>No languages found</div>
        </div>
      </div>
      <button type="button" class="visua11y-agent-menu-close" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="visua11y-agent-menu-content">
    <div class="visua11y-agent-card" hidden>
      <select
        id="visua11y-agent-language"
        title="Language"
        class="visua11y-agent-select"
        hidden
      ></select>
    </div>

    <div class="visua11y-agent-card visua11y-agent-profiles-card">
      <button
        type="button"
        class="visua11y-agent-profile-toggle"
        aria-expanded="false"
        aria-controls="visua11y-agent-profile-grid"
      >
        <span class="visua11y-agent-card-title">
          <span class="visua11y-agent-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path
                d="M20.5 6c-2.61.7-5.67 1-8.5 1s-5.89-.3-8.5-1L3 8c1.86.5 4 .83 6 1v13h2v-6h2v6h2V9c2-.17 4.14-.5 6-1l-.5-2zM12 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"
              />
            </svg>
          </span>
          <span
            class="visua11y-agent-translate"
            data-translate="Accessibility Profiles"
          >
            Accessibility Profiles
          </span>
        </span>
        <span class="visua11y-agent-profile-toggle-arrow" aria-hidden="true"></span>
      </button>
      <div
        class="visua11y-agent-profile-grid"
        id="visua11y-agent-profile-grid"
        role="list"
      ></div>
    </div>

    <div class="visua11y-agent-card">
      <div class="visua11y-agent-card-title">Content Adjustments</div>
      <div class="visua11y-agent-adjust-font">
        <div class="visua11y-agent-label" style="margin: 0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" style="margin-right: 12px">
            <rect x="13" y="10" width="7" height="10" rx="2" fill="currentColor" fill-opacity="0.2"/>
            <path d="M3 7V4h12v3M9 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 12v-2h6v2M17 10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="visua11y-agent-translate">Adjust Font Size</div>
        </div>
        <div>
          <div
            class="visua11y-agent-minus"
            data-key="font-size"
            role="button"
            aria-pressed="false"
            title="Decrease Font Size"
            tabindex="0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="visua11y-agent-amount">100%</div>
          <div
            class="visua11y-agent-plus"
            data-key="font-size"
            role="button"
            aria-pressed="false"
            title="Increase Font Size"
            tabindex="0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="visua11y-agent-items content"></div>
    </div>

    <div class="visua11y-agent-card">
      <div class="visua11y-agent-card-title">Color Adjustments</div>
      <div class="visua11y-agent-items contrast"></div>
      <div class="visua11y-agent-custom-palette-card">
        <div class="visua11y-agent-custom-palette-header">
          <span class="visua11y-agent-custom-palette-icon" aria-hidden="true"></span>
          <div>
            <div
              class="visua11y-agent-custom-palette-title visua11y-agent-translate"
              data-translate="Custom Color"
            >
              Custom Color
            </div>
            <div
              class="visua11y-agent-custom-palette-subtitle visua11y-agent-translate"
              data-translate="Change the site's colors"
            >
              Change the site's colors
            </div>
          </div>
        </div>
        <div class="visua11y-agent-custom-palette-tabs" role="tablist">
          <button
            type="button"
            class="visua11y-agent-custom-palette-tab"
            data-category="backgrounds"
            role="tab"
            aria-selected="true"
          >
            <span class="visua11y-agent-translate" data-translate="Backgrounds">Backgrounds</span>
          </button>
          <button
            type="button"
            class="visua11y-agent-custom-palette-tab"
            data-category="headings"
            role="tab"
            aria-selected="false"
          >
            <span class="visua11y-agent-translate" data-translate="Headings">Headings</span>
          </button>
          <button
            type="button"
            class="visua11y-agent-custom-palette-tab"
            data-category="contents"
            role="tab"
            aria-selected="false"
          >
            <span class="visua11y-agent-translate" data-translate="Contents">Contents</span>
          </button>
        </div>
        <div class="visua11y-agent-custom-palette-slider">
          <input
            type="range"
            min="0"
            max="360"
            step="1"
            value="0"
            class="visua11y-agent-custom-palette-range"
            aria-label="Color hue"
          />
        </div>
        <div class="visua11y-agent-custom-palette-reset-row">
          <button
            type="button"
            class="visua11y-agent-custom-palette-reset visua11y-agent-translate"
            data-translate="Reset colors"
          >
            Reset colors
          </button>
        </div>
      </div>
    </div>

    <div class="visua11y-agent-card">
      <div class="visua11y-agent-card-title">Tools</div>
      <div class="visua11y-agent-items tools"></div>
    </div>

    <div class="visua11y-agent-card visua11y-agent-settings-card">
      <button type="button" class="visua11y-agent-settings-toggle" aria-expanded="false">
        <span class="visua11y-agent-settings-info">
          <span class="visua11y-agent-settings-icon" aria-hidden="true"></span>
          <span class="visua11y-agent-translate" data-translate="Widget Settings"
            >Widget Settings</span
          >
        </span>
        <span class="visua11y-agent-settings-toggle-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
      <div class="visua11y-agent-settings-panel">
        <div class="visua11y-agent-position-card">

            <button type="button" class="visua11y-agent-position-btn" data-position="top-left">

                <rect x="4.5" y="4.5" width="5" height="5" rx="1.5" fill="currentColor"/>

              <span class="visua11y-agent-translate" data-translate="Top Left">Top Left</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="top-center">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="9.5" y="4.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Top Center">Top Center</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="top-right">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="14.5" y="4.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Top Right">Top Right</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="center-left">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="4.5" y="7.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Center Left">Center Left</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="center-right">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="14.5" y="7.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Center Right">Center Right</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="bottom-left">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="4.5" y="10.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Bottom Left">Bottom Left</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="bottom-center">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="9.5" y="10.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Bottom Center">Bottom Center</span>
            </button>
            <button type="button" class="visua11y-agent-position-btn" data-position="bottom-right">
              <svg class="visua11y-agent-pos-icon" viewBox="0 0 24 20" fill="none">
                <rect x="2" y="2" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/>
                <rect x="14.5" y="10.5" width="5" height="5" rx="1.5" fill="currentColor"/>
              </svg>
              <span class="visua11y-agent-translate" data-translate="Bottom Right">Bottom Right</span>
            </button>

        <hr class="visua11y-agent-settings-divider" />

        <div class="visua11y-agent-size-card">
          <div
            class="visua11y-agent-settings-section-title visua11y-agent-translate"
            data-translate="Widget Size"
          >
            Widget Size
          </div>
          <div class="visua11y-agent-size-grid" role="group" aria-label="Widget Size">
            <button
              type="button"
              class="visua11y-agent-position-btn visua11y-agent-size-btn"
              data-size="default"
              aria-pressed="false"
            >
              <svg class="visua11y-agent-size-icon" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="2"/>

              <span class="visua11y-agent-translate" data-translate="Default">Default</span>

            <button
              type="button"
              class="visua11y-agent-position-btn visua11y-agent-size-btn"

    <div class="visua11y-agent-card" style="margin-bottom: 8px">
