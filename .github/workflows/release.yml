name: Release & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v

      - name: Check NPM token availability
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "❌ NPM_TOKEN is not defined. Please set the secret in GitHub."
            exit 1
          fi
          echo "✅ NPM_TOKEN appears to be set (length ${#NPM_TOKEN})."

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Release to NPM & GitHub
        run: npx --no-install semantic-release

      - name: Ensure Docs & Demo are built
        run: npm run docs:publish

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/.vitepress/dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
